manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.shopify
kind: tool_provider
version: 0.4.0
release_stage: active
billing_mode: free
display_name: Shopify
description: Shopify Admin GraphQL API 2026-07 for inventory, catalog and order automation, typed and scoped to project-owned Shopify stores. Every endpoint it uses is covered in full, and what is not reachable is listed with the reason.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-ecommerce-shopify/issues
  website_url: https://github.com/Flow-Steward/ext-ecommerce-shopify
listing:
  category: ecommerce
  tags: [shopify, inventory, stock, products, orders, fulfillment, graphql, ecommerce]
  summary: Create products with SKU, price, stock and images in one step; manage inventory, catalog and orders; find products with missing or small images.
features: [tool, action]
required_scopes: [extension:invoke, artifact:read, artifact:write]
account_scope:
  scope_type: project
  description: Each Shopify store connection and the OAuth grant behind it are scoped to one project. A project may hold several independent Shopify connections.
external_effects:
  - {operation_id: set_inventory_quantities, effect_kind: shopify_inventory_set_quantities, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: create_product, effect_kind: shopify_product_create, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: create_products_bulk, effect_kind: shopify_product_bulk_create, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: update_product, effect_kind: shopify_product_update, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: create_product_variants_batch, effect_kind: shopify_product_variants_create, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: update_product_variants_batch, effect_kind: shopify_product_variants_update, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: set_catalog_metafields, effect_kind: shopify_catalog_metafields_set, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: update_product_media, effect_kind: shopify_product_media_update, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: update_order_metadata, effect_kind: shopify_order_metadata_update, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: set_order_metafields, effect_kind: shopify_order_metafields_set, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: create_fulfillment, effect_kind: shopify_fulfillment_create, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: update_fulfillment_tracking, effect_kind: shopify_fulfillment_tracking_update, channel: shopify_admin_graphql, idempotency: required, test_mode_behavior: suppress}
runtime:
  extension_contract_v2:
    oauth_providers:
      - provider_id: shopify_admin_oauth
        display_name: Shopify app
        description: Credentials for one Shopify app created in the Dev Dashboard, used to authorize the stores this project automates.
        setup_page_id: setup-guide
        help_page_id: setup-guide
        error_help_anchors:
          invalid_client: app-credentials
          authorization_required: authorize-again
          provider_unavailable: app-setup
        # Shopify's authorization server rejects the PKCE parameters rather than
        # ignoring them, and the code is redeemed with the client secret, so this
        # provider is a confidential client without PKCE.
        flow: {type: authorization_code, pkce: none}
        scope_separator: comma
        # Every store is its own host, so the endpoints are built from the shop the
        # operator names when they create the connection, and from nothing else.
        origin_binding:
          binding_id: shop_origin
          input_id: shop_domain
          host_suffix: .myshopify.com
          label: {charset: lowercase_alnum_hyphen, min_length: 1, max_length: 60}
        credential_fields:
          - {field_id: client_id, value_type: text, required: true, secret: false, browser_exposable: true, change_policy: reauthorization_required, label: Shopify Client ID, help_text: "The Client ID of your Shopify app, from the Dev Dashboard under Credentials.", autocomplete: username, validation: {min_length: 1, max_length: 512}}
          - {field_id: client_secret, value_type: secret, required: true, secret: true, change_policy: runtime_revalidate, label: Shopify Client secret, help_text: "The matching Client secret from the same Shopify app. It signs the callback and redeems the authorization code.", autocomplete: current-password, validation: {min_length: 1, max_length: 4096}}
        authorization_endpoint: {origin_binding: shop_origin, path: /admin/oauth/authorize}
        token_endpoint: {origin_binding: shop_origin, path: /admin/oauth/access_token, client_auth_method: client_secret_post}
        # Shopify redeems the code with the client credentials alone and rejects
        # grant_type and redirect_uri. `expiring=1` is what asks for a token that
        # expires and carries a refresh token.
        code_exchange:
          include_grant_type: false
          include_redirect_uri: false
          static_parameters: {expiring: "1"}
          # Shopify's token response omits token_type; its tokens are bearer
          # tokens all the same. Core requires the field unless a provider says
          # what leaving it out means.
          implicit_token_type: bearer
          # Shopify documents all five on both the initial exchange and the
          # refresh. A response missing any of them is malformed, not partial:
          # reconstructing the granted scopes from what was asked for would
          # record a grant nobody confirmed.
          required_response_fields:
            - access_token
            - scope
            - expires_in
            - refresh_token
            - refresh_token_expires_in
        callback_verification:
          signature_parameter: hmac
          algorithm: hmac_sha256
          digest: hex
          message: sorted_query_excluding_signature
          secret_source: client_secret
          subject_parameter: shop
          subject_binding: shop_origin
        # Shopify retires an app's previous expiring token for a store whenever a
        # new one is issued, so a second connection to the same shop under the same
        # app would silently break the first. One per configuration and shop.
        unique_subject_per_configuration: true
        callback_id: oauth_authorization
        authorization_intents:
          - intent_id: shopify_connect
            static_parameters: {}
            user_inputs:
              - {input_id: shop_domain, origin_binding: shop_origin, validation: {type: hostname_label, max_length: 80}}
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifact_policies:
  - operation_id: create_products_bulk
    inputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: bulk_products_input, field: artifact_handle, required: false, max_size_bytes: 100000000}
  - operation_id: create_product
    inputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: product_image_files, field: image_files, required: false, max_size_bytes: 20971520}
  - operation_id: update_product
    inputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: product_image_files, field: image_files, required: false, max_size_bytes: 20971520}
  - operation_id: export_products
    outputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: shopify_products_export, filename: shopify-products.jsonl, content_type: application/x-ndjson, max_size_bytes: 209715200, max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES, retention_class: run_window}
entrypoint: {mode: subprocess, command: [python3, main.py], timeout_seconds: 120}
health: {command: [python3, health.py], timeout_seconds: 5}
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
callbacks:
  - {callback_id: oauth_authorization, purpose: oauth_authorization, methods: [GET], connection_scoped: false}
python_requirements: []
