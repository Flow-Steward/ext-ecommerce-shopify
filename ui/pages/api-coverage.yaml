components:
  - component_id: api_coverage
    type: markdown
    title: Coverage of the official Admin API
    body: |
      Every operation is checked, field by field, against Shopify's official Admin GraphQL `2026-07` schema by the extension's own tests. The rule is complete coverage of each endpoint used:

      - **Writes:** every field of every Shopify input object the mutation accepts can be set.
      - **Lists:** every filter, sort and order argument Shopify offers can be used.
      - **Records:** every scalar and money field of the Shopify type is returned.

      Anything outside that rule is listed below with its reason. Pages are always read forwards (`first` and `after`; Shopify's `last` and `before` are not offered). Money fields carry the shop-currency amount (MoneyBag.shopMoney); the presentment currency amount is not read. Related records — a customer, an address, a transaction — are not part of a record; where Flow Steward offers a dedicated operation for one, use that.

      ### Test the connection (`test_connection`)

      Shopify: `shop`.

      ### Get the store (`get_shop`)

      Shopify: `shop`.
      Result `Shop`: 27 of 29 scalar and money fields, without:
      - `email` — The store owner's personal email address.
      - `shopOwnerName` — The store owner's personal name.

