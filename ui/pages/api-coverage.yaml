      ### Arguments set by the extension itself

      - `Product.variants(after)` — create_product confirms every variant it created in one page; list_product_variants pages through variants.
      - `Product.variants(reverse)` — The nested list is read as one bounded page.
      - `Product.variants(sortKey)` — The nested list is read as one bounded page.
      - `Product.options(first)` — A product has at most three options; all are returned.
      - `Product.media(reverse)` — export_products reads images in their display order.
      - `Fulfillment.trackingInfo(first)` — Bounded to the first 10 tracking entries.
      - `Order.fulfillmentsCount(limit)` — The exact count is wanted, so no upper limit is applied.
      - `Order.fulfillmentsCount(query)` — Counts every fulfillment, so a truncated list can be detected.
      - `InventoryItem.inventoryLevels(reverse)` — The nested list is read as one bounded page.
      - `InventoryItem.inventoryLevels(query)` — The nested list is read as one bounded page.
      - `InventoryItem.inventoryLevels(includeInactive)` — export_products reports the locations an item is stocked at.
      - `FulfillmentOrder.lineItems(reverse)` — Line items keep Shopify's own order.
      - `FulfillmentOrder.lineItems(after)` — list_order_fulfillment_orders returns one page of line items per fulfillment order; get_fulfillment_order pages through them.
      - `Product.description(truncateAt)` — The whole plain-text description is returned.
      - `Order.statusPageUrl(audience)` — Shopify's default order status page URL is returned.
      - `Order.statusPageUrl(notificationUsage)` — Shopify's default order status page URL is returned.
      - `LineItem.discountedTotalSet(withCodeDiscounts)` — Read with Shopify's default.
      - `Image.url(transform)` — The original image URL is returned, never a resized copy.
      - `InventoryAdjustmentGroup.changes(inventoryItemIds)` — Every change of the adjustment is returned, unfiltered.
      - `InventoryAdjustmentGroup.changes(locationIds)` — Every change of the adjustment is returned, unfiltered.
      - `InventoryAdjustmentGroup.changes(quantityNames)` — Every change of the adjustment is returned, unfiltered.
      - `InventoryLevel.quantities(names)` — Every quantity state is always read.
