      ### Create a product (`create_product`)

      Shopify: `productSet`.
      Inputs: 93 of 110 official input fields can be set, not offered:
      - `synchronous` — Fixed to true: the operation waits for Shopify and returns the product it created, rather than an asynchronous job id.
      - `identifier` — Creating never updates an existing product by mistake; change an existing product with update_product.
      - `input.redirectNewHandle` — Applies only when an existing product's handle changes; see update_product.redirect_new_handle.
      - `input.productOptions.id` — A record being created has no id of its own yet.
      - `input.productOptions.values.id` — A record being created has no id of its own yet.
      - `input.variants.id` — A record being created has no id of its own yet.
      - `input.variants.optionValues.id` — A record being created has no id of its own yet.
      - `input.variants.optionValues.optionId` — A record being created has no id of its own yet.
      - `input.variants.inventoryItem.sku` — SKU is set on the variant itself; Shopify accepts the same value in either place.
      - `input.metafields.id` — A record being created has no id of its own yet.
      - `input.variants.metafields.id` — A record being created has no id of its own yet.
      Result `Product`: 25 of 26 scalar and money fields, without:
      - `defaultCursor` — A pagination cursor; use page_info.end_cursor.
      Result `ProductVariant`: 19 of 20 scalar and money fields, without:
      - `defaultCursor` — A pagination cursor; use page_info.end_cursor.

      ### Create products in bulk (`create_products_bulk`)

      Shopify: `bulkOperationRunMutation`, running `productSet` for each row.
      Inputs: 93 of 110 official input fields can be set, not offered:
      - `identifier` — Bulk creation only creates; it never updates an existing product.
      - `input.redirectNewHandle` — Applies only when an existing product's handle changes.
      - `input.productOptions.id` — A record being created has no id of its own yet.
      - `input.productOptions.values.id` — A record being created has no id of its own yet.
      - `input.variants.id` — A record being created has no id of its own yet.
      - `input.variants.optionValues.id` — A record being created has no id of its own yet.
      - `input.variants.optionValues.optionId` — A record being created has no id of its own yet.
      - `input.variants.inventoryItem.sku` — SKU is set on the variant itself; Shopify accepts the same value in either place.
      - `input.metafields.id` — A record being created has no id of its own yet.
      - `input.variants.metafields.id` — A record being created has no id of its own yet.
      - `synchronous` — Inside a bulk operation Shopify runs every row synchronously.

