page_id: setup-guide
title: Setup Guide
description: Set up the Shopify app once, then authorize each store from Flow Steward.
# The OAuth configuration and the callback URL both belong to one project, so
# this page needs a project selected. Declaring it unscoped — which it was while
# the connection took a hand-pasted token — leaves the platform with no project
# and the whole OAuth setup panel unmounted.
project_scoped: true
components:
  - component_id: setup_guide_operator
    type: markdown
    title: For the person who sets up the Shopify app
    body: |
      This needs access to a Shopify **Dev Dashboard**. The people who later
      connect their stores do not need one.

      Flow Steward runs outside the Shopify admin, so it authorizes with the OAuth
      authorization code grant, and it does not ship a hosted Shopify app: the app
      belongs to you.

      **First, get the callback URL from Flow Steward.** Open this extension's
      **Setup Guide** page in the project you are configuring and copy the field
      labelled `OAuth Redirect URI`. It is generated, so it cannot be typed from
      memory, and Shopify refuses the authorization unless it matches
      character-for-character.

      **It is one callback per Flow Steward project, not one per deployment.** The
      URL is stable once created, but each project gets its own. If you use the
      same Shopify app for several projects, every one of those callback URLs has
      to be added to the app — and a new app version released — before that
      project can authorize a store.

      **Create the app**

      1. Dev Dashboard → `Apps` → `Create app` → `Start from Dev Dashboard`.
      2. `Versions` → `Create a version`.
      3. Clear **`Embed app in Shopify admin`**. Flow Steward is standalone; an
         embedded app authenticates a different way and this extension does not
         support it.
      4. Set the URLs. Add every project's `OAuth Redirect URI` as a redirect URL.
         For **App URL**, a standalone app may use Shopify's default,
         `https://shopify.dev/apps/default-app-home` — it is never where
         authorization happens.
      5. Set the access scopes from the next section.
      6. **`Release`** the version. URLs and scopes belong to a version and take
         effect only when it is released.
      7. `Settings` → copy the **Client ID** and **Client secret**.

      **Choose distribution**

      Partner Dashboard → `App distribution` → `Choose distribution` →
      **`Custom distribution`**. You enter the **store's domain**. Installing on
      several stores of one Plus organization is a separate option to enable, not
      something you type in place of the domain. Generate the install link.

      **Custom distribution cannot be undone.** An app is custom or public for its
      whole life, and a custom app reaches one store, the stores of one Plus
      organization, or eligible development stores — nothing else. Reaching
      arbitrary merchants means a public app and Shopify App Store review, which
      this extension does not cover.

      **Store the credentials in Flow Steward.** Put the Client ID and Client
      secret into the project's OAuth configuration. The secret is held encrypted;
      it is never returned, logged, or put into an error message.

      **Do not create two Flow Steward configurations holding the same Client ID
      for the same store.** Shopify keeps one token per app and store, so the
      second authorization would retire the first one's token.

      **Testing against a local Flow Steward.** Shopify has to reach the callback,
      so a local instance needs a public HTTPS address — an operator-managed tunnel
      such as Cloudflare Tunnel is enough. This is Flow Steward's setup policy for
      this release, not a Shopify rule.

      A tunnel hostname usually changes each time it is started, and that is more
      work than it first looks: the callback URL is derived from
      `FS_PUBLIC_BASE_URL`, and the URLs live in the app **version**. So after every
      change you must edit the redirect URL in the app — and the App URL too, if you
      pointed it at the tunnel rather than at Shopify's default — and **release a new
      version**. Editing without releasing changes nothing.
  - component_id: setup_guide_merchant
    type: markdown
    title: For the person who connects a store
    body: |
      You do **not** need a Shopify developer account, and you do not create or
      copy any token.

      You need two things: the **`Manage and install apps and channels`**
      permission in the Shopify store, and operator or admin access to the Flow
      Steward project.

      **What you do**

      1. If the app is not installed on this store yet, open the Custom
         distribution install link its owner sends you. Shopify shows what the app
         is asking for; install it.
      2. In Flow Steward, open the project's Connections and add a Shopify store
         connection. You are asked for the store only — as `store-name` or
         `store-name.myshopify.com`.
      3. Flow Steward sends you to Shopify. **Approve the request if Shopify shows
         you one** — when the install link already collected your approval,
         Shopify may return you without asking a second time.
      4. You land back in Flow Steward and the connection is created, bound to the
         store Shopify confirmed.

      **If the store you approve is not the store you entered**, no connection is
      created. The name in Shopify's signed answer is what counts.

      **To reconnect later** — after the app is uninstalled and reinstalled, or
      after its credentials are rotated — reconnect the existing connection rather
      than adding a second one for the same store.

      **Disconnecting in Flow Steward does not uninstall the app.** It removes the
      credentials and the connection on this side only; the app stays installed in
      the store until someone uninstalls it in Shopify Admin.
  - component_id: setup_guide_scope
    type: markdown
    title: Which scopes to grant
    body: |
      Grant the full eight-scope set. It is not a menu: the connection type declares it as
      its required set, and Shopify presents a required set to the merchant whole —
      it is accepted or declined, never trimmed.

      So a grant that comes back short is never someone picking and choosing. It
      means the store authorized against an app version that asked for less, or
      the app is configured with the wrong scopes. Either way the fix is on the app
      side: correct the scopes, release a version, authorize the store again.

      ```
      write_inventory
      read_locations
      write_products
      write_files
      write_orders
      write_assigned_fulfillment_orders
      write_merchant_managed_fulfillment_orders
      write_third_party_fulfillment_orders
      ```

      Configure them on the app and **release a version**. Scopes take effect on
      release, not on save, and a store that authorized against an earlier version
      keeps what that version asked for until it authorizes again.

      Shopify write grants include matching read access, but the Location fields selected by
      `list_locations` require the distinct `read_locations` scope:

      | What it covers | Scope |
      |---|---|
      | Location details | `read_locations` |
      | Inventory reads and stock writes | `write_inventory` |
      | Product reads and catalog writes | `write_products` |
      | Media alt text | `write_files` |
      | Order reads and order writes | `write_orders` |
      | Fulfillment orders, whoever owns them | the three `write_*_fulfillment_orders` scopes |

      Each operation publishes one exact all-of requirement; there is no private
      Shopify-only scope dialect. Three
      separate fulfillment-order scopes exist because only Shopify knows whether a
      given fulfillment order belongs to your app, the merchant, or a third-party
      service, and an app holding only one of them is refused the others.

      One consequence worth stating plainly: authorizing this extension grants it
      the ability to change stock, catalog, orders and fulfillments in that store.
      It cannot delete, archive, cancel, refund, publish, or notify a customer —
      see the operation list — but it is not a read-only integration, and it does
      not offer a read-only mode.
  - component_id: setup_guide_capabilities
    type: markdown
    title: What `Test the connection` tells you
    body: |
      A **successful** test confirms exactly two things: the grant still works,
      and it belongs to the store this connection is bound to.

      A failure says less. Shopify may have rejected the grant or answered about
      another store — but the call can also time out, fail to connect, be
      throttled, hit an inactive shop, or come back unreadable or too large. The
      error code says which; a failure is not by itself proof that the
      authorization is bad.

      A new connection with a missing scope is rejected during OAuth callback.
      For an older stale connection, the test reports the missing scope so the
      app can be corrected, released and authorized again.

      The result's `capabilities` field is a readable list of eligible operation IDs.
      Complete diagnostics remain available in `capability_scope_matrix`, keyed by
      operation ID. Each matrix value says whether the granted scopes cover it:

      - `scope_eligible` — whether the scopes allow the call to be attempted.
      - `required_oauth_scopes` — the operation's canonical all-of requirement.
      - `missing_required_oauth_scopes` — required scopes absent from the grant.

      With the full scope set granted every matrix value reads `scope_eligible: true`,
      so the matrix is mainly useful when something is wrong: a `false` value means the
      store authorized against an app version that did not ask for that scope,
      and the fix is to release a version with the full set and authorize the
      store again. Read
      `scope_eligible: true` as "the scopes are not what would stop it" —
      **not** as a promise the operation will succeed. Shopify still applies
      staff permissions, the state of the shop, whether a fulfillment order
      belongs to your app, and the state of the record itself. This extension
      never uses the report to decide whether to send a request; it sends the
      request and lets Shopify answer.
  - component_id: setup_guide_domain
    type: markdown
    title: Which store address to enter
    body: |
      Enter the store's own `myshopify.com` address. Both of these are accepted and are stored the same way:

      - `store-name`
      - `store-name.myshopify.com`

      Whatever you type is normalized to lowercase `store-name.myshopify.com` and used to send you to that store's own authorization page. What is then stored is not what you typed: it is the store name inside Shopify's signed answer, and every later request is built from that. A workflow can never supply a URL of its own.

      These are **not** accepted, and are refused before you are sent to Shopify rather than silently trimmed:

      - anything with a scheme: `https://store-name.myshopify.com`
      - anything with a path: `store-name.myshopify.com/admin`
      - anything with a port: `store-name.myshopify.com:443`
      - anything carrying credentials: `user:pass@store-name.myshopify.com`
      - anything with a query string or fragment: `store-name.myshopify.com?x=1`
      - a wildcard: `*.myshopify.com`
      - a custom storefront domain: `shop.example.com`

      A custom domain is rejected on purpose. Your storefront may answer on `shop.example.com`, but authorization and the Admin API are both addressed through the `myshopify.com` domain, and accepting anything else would mean sending an authorization request, and later an access token, to a host the store does not control.
  - component_id: setup_guide_stock
    type: markdown
    title: How setting stock behaves
    body: |
      **Quantities are absolute, not changes.** `Set stock quantities` writes the number you give as the item's available quantity at that location. Sending `5` sets the level to 5, whatever it was before. It does not add 5. There is no delta-based adjustment in this extension.

      **A quantity of `0` makes the item out of stock at that location.** That is a real business effect, not a harmless no-op: the item stops being purchasable at that location as soon as Shopify applies the write. Nothing is deleted, but the store's behaviour changes immediately.

      **Compare-and-swap: `change_from_quantity`.** Every entry must carry this field, and it has two intended uses:

      - Send the quantity you last read from Shopify. If someone else changed the stock since then, Shopify refuses that entry instead of overwriting their change.
      - Send an explicit `null` to opt out of the check and write regardless.

      `null` is a deliberate choice, which is why the field is required rather than optional: omitting it entirely is rejected, so nobody opts out of concurrency protection by forgetting a key.

      **Repeating an unchanged stock feed succeeds.** When every requested quantity equals its non-null `change_from_quantity`, Shopify may return no adjustment group because there was nothing to change. That CAS-proven no-op succeeds with `inventory_adjustment_group: null`. A missing adjustment group remains `timeout_unknown` if any entry expected a change or used `null`, because that response does not prove the write's outcome.

      **One synchronous batch of up to 250.** A single call accepts 1 to 250 entries and waits for Shopify's answer before reporting anything. It does not split a larger list into several calls, does not retry, and does not start an asynchronous Shopify bulk operation. Send at most 250 entries per step; if you need more, run more steps.

      **The same item at the same location may appear only once per call.** A batch naming one pair twice is rejected before it is sent, because the resulting stock level would depend on the order Shopify happened to apply the two entries in.

      **Duplicate protection.** Shopify offers an idempotency key on `inventorySetQuantities`, and this operation uses Flow Steward's external effect id as that key — so a retried delivery of the same step does not apply the same stock write twice.

      No other action in this extension has that protection, because Shopify does not offer it on the other mutations. Every action still requires an external effect id, but for the other ten it identifies the step to Flow Steward rather than de-duplicating anything at Shopify. Treat a retry of those as a second write.

      **When the answer never arrives.** If the connection drops or times out after the mutation has been sent, the step fails with `timeout_unknown` rather than reporting success or silently retrying: at that point the write may or may not have been applied, and only Shopify knows. Read the level back before deciding what to do.
  - component_id: setup_guide_multiple
    type: markdown
    title: Several stores in one project
    body: |
      A project may hold as many Shopify connections as it needs — one per store. Give each one a display name that identifies the store.

      Every operation takes the connection it runs against as an input, and the platform loads that connection's verified store and token for that one invocation only. Nothing is cached between invocations and no connection is "active": two steps in the same workflow can address two different stores, in either order, without either one seeing the other's credentials.
  - component_id: shopify_app_credentials_help
    anchor_id: app-credentials
    type: markdown
    title: App credentials
    content: Check that the Client ID and Client secret come from the same Shopify app, and that a released version of that app lists this project's OAuth Redirect URI exactly as the Setup Guide shows it.
  - component_id: shopify_authorize_again_help
    anchor_id: authorize-again
    type: markdown
    title: Authorize again
    content: Reconnect this store and approve the permissions Shopify lists. Authorization ends if the app is uninstalled in the store or its credentials are rotated.
  - component_id: shopify_app_setup_help
    anchor_id: app-setup
    type: markdown
    title: App setup
    content: Confirm the Shopify app is standalone rather than embedded, that a version carrying the required scopes has been released, and that the store is covered by the app's Custom distribution.
