page_id: inventory-api
title: Inventory API
description: Every Shopify operation this extension can run, and what each one needs.
project_scoped: false
components:
  - component_id: inventory_api_operations
    type: markdown
    title: Operations
    body: |
      Every operation below is fixed in advance and typed against Shopify Admin GraphQL `2026-07`. Nothing is discovered from your store, no operation accepts GraphQL of its own, and there is no general-purpose request action.

      Each operation states its canonical `required_oauth_scopes` all-of requirement. New connections must grant the complete eight-scope set; an incomplete OAuth callback is rejected. `Test the connection` reports per-operation eligibility only to diagnose an older stale grant. Eligibility means the scopes permit the attempt — Shopify staff permissions, shop state and record state still decide the outcome.

      ### Check connection settings

      Normalizes and checks the store address before the connection is saved, without contacting Shopify.

      - Action id: `validate_connection_settings`
      - Kind: source
      - Contacts Shopify: no
      - Available in workflows: no
      - Inputs: `shop_domain`
      - Results: `valid`, `normalized_shop_domain`
      - Scopes: no business-resource scope

      ### Test the connection

      Checks that the authorization still works and belongs to the connected store, then reports which operations its granted scopes allow.

      - Action id: `test_connection`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`
      - Results: `shop_id`, `shop_name`, `myshopify_domain`, `api_version`, `granted_scopes`, `capability_summary`, `capabilities`, `capability_scope_matrix`
      - Scopes: no business-resource scope

      ### Get the store

      Returns a fixed, bounded set of store identity and locale fields.

      - Action id: `get_shop`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`
      - Results: `shop`
      - Scopes: no business-resource scope

      ### List locations

      Returns one cursor-paginated page of inventory locations. Pass end_cursor back as after to read the next page.

      - Action id: `list_locations`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `first` (optional), `after` (optional), `include_inactive` (optional)
      - Results: `locations`, `page_info`
      - Scopes: `write_inventory`, `read_locations`

      ### List inventory items

      Returns one cursor-paginated page of inventory items, optionally narrowed to one SKU. Pass end_cursor back as after to read the next page.

      - Action id: `list_inventory_items`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `first` (optional), `after` (optional), `sku` (optional)
      - Results: `inventory_items`, `page_info`
      - Scopes: `write_inventory`

      ### Get an inventory item

      Returns one inventory item, found by its Shopify inventory item id.

      - Action id: `get_inventory_item`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `inventory_item_id`
      - Results: `inventory_item`
      - Scopes: `write_inventory`

      ### Get stock for many items at one location

      Returns the available and on-hand quantities for up to 250 inventory items at one location, in the order they were asked for.

      - Action id: `get_inventory_levels_batch`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `location_id`, `inventory_item_ids`, `include_inactive` (optional)
      - Results: `location_id`, `items`
      - Scopes: `write_inventory`

      ### Set stock quantities

      Sets absolute available quantities for 1 to 250 inventory items and waits for Shopify's answer. This changes what the store has in stock; a quantity of 0 makes the item out of stock at that location.

      - Action id: `set_inventory_quantities`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `quantities`
      - Results: `inventory_adjustment_group`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_inventory`
      - External effect: `shopify_inventory_set_quantities`

      ### List products

      Returns one cursor-paginated page of products. Pass end_cursor back as after to read the next page.

      - Action id: `list_products`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `first` (optional), `after` (optional), `filter` (optional)
      - Results: `products`, `page_info`
      - Scopes: `write_products`

      ### Export all matching products

      Follows every Shopify product cursor and streams the complete matching catalog to a JSONL artifact. Use filter to export a filtered subset.

      - Action id: `export_products`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `first` (optional), `include_images` (optional), `include_variants` (optional), `include_inventory` (optional), `filter` (optional)
      - Results: `artifact_handle`, `filename`, `content_type`, `item_count`, `page_count`, `size_bytes`, `sha256`, `artifacts`
      - Scopes: `write_products`

      ### Get a product

      Returns one product, found by its Shopify product id.

      - Action id: `get_product`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `product_id`
      - Results: `product`
      - Scopes: `write_products`

      ### List product variants

      Returns one cursor-paginated page of product variants across the store. Pass end_cursor back as after to read the next page.

      - Action id: `list_product_variants`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `first` (optional), `after` (optional)
      - Results: `product_variants`, `page_info`
      - Scopes: `write_products`

      ### Get a product variant

      Returns one product variant, found by its Shopify variant id.

      - Action id: `get_product_variant`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `product_variant_id`
      - Results: `product_variant`
      - Scopes: `write_products`

      ### List catalog metafields

      Returns one cursor-paginated page of metafields for one product or one product variant. The owner type must match the id.

      - Action id: `list_catalog_metafields`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `owner_type`, `owner_id`, `first` (optional), `after` (optional)
      - Results: `owner_id`, `owner_type`, `metafields`, `page_info`
      - Scopes: `write_products`

      ### List product media

      Returns one cursor-paginated page of the media attached to one product. Reads media and processing status, including images supplied during product creation.

      - Action id: `list_product_media`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `product_id`, `first` (optional), `after` (optional)
      - Results: `product_id`, `media`, `page_info`
      - Scopes: `write_products`

      ### Create a product

      Creates one product as a draft. Shopify creates only the initial variant, using the first value of each supplied option. product_variants contains that one variant and its inventory item so a workflow can immediately set SKU, price and stock; add the rest with the variant batch operations. Optional images are downloaded from public HTTPS URLs and processed asynchronously. No metafields, collections or publications are created.

      - Action id: `create_product`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `title`, `handle`, `description_html` (optional), `vendor` (optional), `product_type` (optional), `tags` (optional), `category_id` (optional), `seo_title` (optional), `seo_description` (optional), `options` (optional), `images` (optional)
      - Results: `product`, `product_variants`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_products`
      - External effect: `shopify_product_create`

      ### Create products in bulk

      Uploads a batch of new draft products for asynchronous creation. Supply either products or a JSONL artifact containing create_product fields. Submission success is not per-row success; Shopify continues processing after this action returns. Creates only the initial variant.

      - Action id: `create_products_bulk`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `products` (optional), `artifact_handle` (optional)
      - Results: `bulk_operation`, `item_count`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_products`
      - External effect: `shopify_product_bulk_create`

      ### Update a product

      Changes one product. Only the fields you supply are sent; everything else is left as it is. replace_tags overwrites the whole tag list. Status, publications, collections, media and metafields are out of reach here.

      - Action id: `update_product`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `product_id`, `title` (optional), `description_html` (optional), `vendor` (optional), `product_type` (optional), `handle` (optional), `replace_tags` (optional), `category_id` (optional), `seo_title` (optional), `seo_description` (optional)
      - Results: `product`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_products`
      - External effect: `shopify_product_update`

      ### Create product variants

      Creates 1 to 250 variants on one product in a single call. The product's options must already exist. The product's standalone variant is preserved. Stock quantities are not part of this: set them with the inventory operations.

      - Action id: `create_product_variants_batch`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `product_id`, `variants`
      - Results: `product_variants`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_products`
      - External effect: `shopify_product_variants_create`

      ### Update product variants

      Changes 1 to 250 existing variants on one product in a single call. Shopify is asked to apply all of them or none. Each entry must name a variant and carry at least one actual change.

      - Action id: `update_product_variants_batch`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `product_id`, `variants`
      - Results: `product_variants`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_products`
      - External effect: `shopify_product_variants_update`

      ### Set catalog metafields

      Creates or updates 1 to 25 metafields on products and product variants in one atomic call. Every entry carries a compare digest, so a value someone else changed since you read it is refused rather than overwritten.

      - Action id: `set_catalog_metafields`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `metafields`
      - Results: `metafields`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_products`
      - External effect: `shopify_catalog_metafields_set`

      ### Update media alt text

      Changes the alt text of one existing media file. Nothing else about the file is touched: not its source, filename, preview, or which products it belongs to.

      - Action id: `update_product_media_alt`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `media_id`, `alt`
      - Results: `file`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_files`
      - External effect: `shopify_product_media_alt_update`

      ### List orders

      Returns one cursor-paginated page of orders. Customer, address, payment and contact details are never requested.

      - Action id: `list_orders`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `first` (optional), `after` (optional)
      - Results: `orders`, `page_info`
      - Scopes: `write_orders`

      ### Get an order

      Returns one order, found by its Shopify order id. Customer, address, payment and contact details are never requested.

      - Action id: `get_order`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `order_id`
      - Results: `order`
      - Scopes: `write_orders`

      ### List order line items

      Returns one cursor-paginated page of the line items on one order.

      - Action id: `list_order_line_items`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `order_id`, `first` (optional), `after` (optional)
      - Results: `order_id`, `line_items`, `page_info`
      - Scopes: `write_orders`

      ### List order metafields

      Returns one cursor-paginated page of the metafields on one order.

      - Action id: `list_order_metafields`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `order_id`, `first` (optional), `after` (optional)
      - Results: `order_id`, `metafields`, `page_info`
      - Scopes: `write_orders`

      ### List fulfillment orders

      Returns one cursor-paginated page of the fulfillment orders on one order, each with an explicitly sized page of its own line items.

      - Action id: `list_order_fulfillment_orders`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `order_id`, `first` (optional), `after` (optional), `line_items_first` (optional)
      - Results: `order_id`, `fulfillment_orders`, `page_info`
      - Scopes: `write_orders`, `write_assigned_fulfillment_orders`, `write_merchant_managed_fulfillment_orders`, `write_third_party_fulfillment_orders`

      ### Get a fulfillment order

      Returns one fulfillment order with an explicitly paginated page of its line items.

      - Action id: `get_fulfillment_order`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `fulfillment_order_id`, `line_items_first` (optional), `line_items_after` (optional)
      - Results: `fulfillment_order`
      - Scopes: `write_orders`, `write_assigned_fulfillment_orders`, `write_merchant_managed_fulfillment_orders`, `write_third_party_fulfillment_orders`

      ### List order fulfillments

      Returns up to 250 of an order's fulfillments plus the store's own total, so a caller can tell a complete answer from a partial one.

      - Action id: `list_order_fulfillments`
      - Kind: source
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `order_id`, `first` (optional)
      - Results: `order_id`, `fulfillments`, `total_count`, `truncated`
      - Scopes: `write_orders`

      ### Update order metadata

      Changes an order's note, PO number, tags or custom attributes. The two replace_ fields overwrite their whole list. Customers, addresses, payments, line items, refunds and order edits are out of reach here.

      - Action id: `update_order_metadata`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `order_id`, `note` (optional), `po_number` (optional), `replace_tags` (optional), `replace_custom_attributes` (optional)
      - Results: `order`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_orders`
      - External effect: `shopify_order_metadata_update`

      ### Set order metafields

      Creates or updates 1 to 25 metafields on orders in one atomic call, with the same compare-and-set protection as the catalog operation.

      - Action id: `set_order_metafields`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `metafields`
      - Results: `metafields`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_orders`
      - External effect: `shopify_order_metafields_set`

      ### Create a fulfillment

      Fulfills named line items on named fulfillment orders. Every line item and quantity must be stated: Shopify would otherwise fulfil everything remaining, and that is not a decision an omitted field should make. The customer is not notified.

      - Action id: `create_fulfillment`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `fulfillment_orders`, `tracking` (optional)
      - Results: `fulfillment`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_assigned_fulfillment_orders`, `write_merchant_managed_fulfillment_orders`, `write_third_party_fulfillment_orders`
      - External effect: `shopify_fulfillment_create`

      ### Update fulfillment tracking

      Replaces the tracking information on one existing fulfillment. At least one tracking value is required: this operation cannot be used to clear tracking. The customer is not notified.

      - Action id: `update_fulfillment_tracking`
      - Kind: action
      - Contacts Shopify: yes
      - Available in workflows: yes
      - Inputs: `connection_ref`, `fulfillment_id`, `tracking`
      - Results: `fulfillment`, `external_effect_status`, `definitely_no_external_effect`
      - Scopes: `write_assigned_fulfillment_orders`, `write_merchant_managed_fulfillment_orders`, `write_third_party_fulfillment_orders`
      - External effect: `shopify_fulfillment_tracking_update`
