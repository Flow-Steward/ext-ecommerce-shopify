  fields:
  - name: order_id
    label: Order id
    widget_type: text
    required: true
    help_text: A gid://shopify/Order/... id.
    placeholder: gid://shopify/Order/5042
- operation_id: list_order_line_items
  title: List order line items
  fields:
  - name: order_id
    label: Order id
    widget_type: text
    required: true
    help_text: A gid://shopify/Order/... id.
    placeholder: gid://shopify/Order/5042
  - name: first
