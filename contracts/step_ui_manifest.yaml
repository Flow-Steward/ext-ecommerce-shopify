- operation_id: update_product_media
  title: Update a media file
  fields:
  - name: media_id
    label: Media id
    widget_type: text
    required: true
    help_text: A MediaImage, Video, Model3d, ExternalVideo or GenericFile id.
  - name: alt
    label: Alt text
    widget_type: text
    required: false
    help_text: The replacement alt text.
  - name: source_url
    label: Replacement source URL
    widget_type: text
    required: false
    help_text: A public https:// URL to replace the file's content with.
  - name: preview_image_url
    label: Preview image URL
    widget_type: text
    required: false
    help_text: A public https:// image URL to use as the file's preview.
  - name: filename
    label: Filename
    widget_type: text
    required: false
    help_text: 'Replacement filename for the media file, including its extension. Example: blue-mug.jpg.'
    placeholder: blue-mug.jpg
  - name: add_to_product_ids
    label: Attach to products
    widget_type: json
    required: false
    help_text: 'Existing product GIDs to associate with this file, as a JSON array. Example: ["gid://shopify/Product/1042"].'
  - name: remove_from_product_ids
    label: Detach from products
    widget_type: json
    required: false
    help_text: 'Existing product GIDs to disassociate from this file, as a JSON array. Example: ["gid://shopify/Product/1042"].'
