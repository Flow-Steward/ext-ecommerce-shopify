- operation_id: list_catalog_metafields
  display_name: List catalog metafields
  description: Returns one cursor-paginated page of metafields for one product or one product variant, optionally narrowed to a namespace or named keys. The owner type must match the id.
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: owner_type
    value_type: text
    required: true
    schema:
      type: string
      title: Owner type
      description: Which kind of record owns the metafields.
      enum:
      - product
      - product_variant
  - name: owner_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Owner id
      description: A Product or ProductVariant id matching the owner type.
  - name: first
    value_type: integer
    required: false
    schema:
      type: integer
      title: Page size
      description: How many metafields to return, 1 to 250.
      minimum: 1
      maximum: 250
      default: 50
  - name: after
    value_type: text
    required: false
    schema:
      type: string
      title: After cursor
      description: The end_cursor of the previous page.
      minLength: 1
      maxLength: 1024
  - name: namespace
    value_type: text
    required: false
    schema:
      type: string
      title: Namespace
      description: Only metafields in this namespace.
      minLength: 1
      maxLength: 255
  - name: keys
    value_type: array
    required: false
    schema:
      type: array
      title: Keys
      description: Only these metafields, each written "namespace.key".
      minItems: 1
      maxItems: 250
      items:
        type: string
        minLength: 3
        maxLength: 320
  - name: reverse
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Reverse order
      description: Return the results in reverse order.
      default: false
  outputs:
  - name: owner_id
    value_type: text
    schema:
      type: string
  - name: owner_type
    value_type: text
    schema:
      type: string
  - name: metafields
