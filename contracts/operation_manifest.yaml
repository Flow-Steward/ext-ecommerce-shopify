- operation_id: set_inventory_quantities
  display_name: Set stock quantities
  description: Sets absolute available (or on-hand) quantities for 1 to 250 inventory items and waits for Shopify's answer. This changes what the store has in stock; a quantity of 0 makes the item out of stock at that location.
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_inventory
  effect_kind: shopify_inventory_set_quantities
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: quantities
    value_type: array
    required: true
    schema:
      type: array
      title: Quantities
      description: Between 1 and 250 absolute quantities. Each entry names one inventory item at one location.
      minItems: 1
      maxItems: 250
      items:
        type: object
        additionalProperties: false
        required:
        - inventory_item_id
        - location_id
        - quantity
        - change_from_quantity
        properties:
          inventory_item_id:
            type: string
            minLength: 1
            maxLength: 128
            title: Inventory item id
