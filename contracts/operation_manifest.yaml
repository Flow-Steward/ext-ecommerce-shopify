- operation_id: list_orders
  display_name: List orders
  description: Returns one cursor-paginated page of orders, optionally filtered and sorted. Customer names, emails, phone numbers and addresses are never requested.
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_orders
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: first
    value_type: integer
    required: false
    schema:
      type: integer
      title: Page size
      description: How many orders to return, 1 to 15.
      minimum: 1
      maximum: 15
      default: 15
  - name: after
    value_type: text
    required: false
    schema:
      type: string
      title: After cursor
      description: The end_cursor of the previous page.
      minLength: 1
      maxLength: 1024
  - name: filter
    value_type: text
    required: false
    schema:
      type: string
      title: Shopify search query
      description: An optional Shopify search expression, for example financial_status:paid, fulfillment_status:unfulfilled, created_at:>2026-01-01 or tag:wholesale.
      minLength: 1
      maxLength: 4096
