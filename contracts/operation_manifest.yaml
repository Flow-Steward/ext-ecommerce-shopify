- operation_id: set_inventory_quantities
  display_name: Set stock quantities
  description: Sets absolute available quantities for 1 to 250 inventory items and waits for Shopify's answer. This changes what the store has in stock; a quantity of 0 makes the item out of stock at that location.
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_inventory
  effect_kind: shopify_inventory_set_quantities
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: quantities
    value_type: array
    required: true
    schema:
      type: array
      title: Quantities
      description: Between 1 and 250 absolute quantities. Each entry names one inventory item at one location.
      minItems: 1
      maxItems: 250
      items:
        type: object
        additionalProperties: false
        required:
        - inventory_item_id
        - location_id
        - quantity
        - change_from_quantity
        properties:
          inventory_item_id:
            type: string
            minLength: 1
            maxLength: 128
            title: Inventory item id
            description: A gid://shopify/InventoryItem/... id.
          location_id:
            type: string
            minLength: 1
            maxLength: 128
            title: Location id
            description: A gid://shopify/Location/... id.
          quantity:
            type: integer
            title: Quantity
            description: The absolute available quantity to set, not a change. 0 makes the item out of stock at that location.
            minimum: 0
            maximum: 2147483647
          change_from_quantity:
            type:
            - integer
            - 'null'
            title: Change from quantity
            description: The quantity you last read, so Shopify can refuse the write if someone else changed it first. Send null to write regardless.
            minimum: 0
            maximum: 2147483647
  outputs:
  - name: inventory_adjustment_group
    value_type: object
    schema:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - id
      - created_at
      - reason
      - reference_document_uri
      - changes
      properties:
        id:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        reference_document_uri:
          type:
          - string
          - 'null'
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - inventory_item_id
            - location_id
            - name
            - delta
            - quantity_after_change
            properties:
              inventory_item_id:
                type:
                - string
                - 'null'
              location_id:
                type:
                - string
                - 'null'
              name:
                type:
                - string
                - 'null'
              delta:
                type:
                - integer
                - 'null'
              quantity_after_change:
                type:
                - integer
                - 'null'
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.inventory_adjustment_group
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes:
  - invalid_payload
  - invalid_configuration
  - invalid_connection
