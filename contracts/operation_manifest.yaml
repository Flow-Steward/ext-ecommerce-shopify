- operation_id: export_products
  display_name: Export all matching products
  description: Follows every Shopify product cursor and streams the complete matching catalog to a JSONL artifact. Use filter to export a subset, or quality_filter to export only products with missing or small images, short descriptions or empty fields.
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: first
    value_type: integer
    required: false
    schema:
      type: integer
      title: Page size
      description: How many products to read per request, 1 to 200.
      minimum: 1
      maximum: 200
      default: 50
  - name: include_images
    value_type: boolean
    required: false
    schema:
      type: boolean
      default: false
      title: Include images
      description: Export every image with URL, alt text, width and height, plus image_count. Adds paginated reads.
  - name: include_variants
    value_type: boolean
    required: false
    schema:
      type: boolean
      default: false
      title: Include variants
      description: Export every variant record. Adds paginated reads.
  - name: include_inventory
    value_type: boolean
    required: false
    schema:
      type: boolean
      default: false
      title: Include inventory
      description: Include variants automatically and export all inventory locations and quantities. Requires read_inventory or write_inventory, plus read_locations. Adds paginated reads.
  - name: filter
    value_type: text
    required: false
    schema:
      type: string
      title: Shopify search query
      description: An optional Shopify search expression, for example status:active, vendor:Acme, tag:summer, or category_id:sg-4-17.
      minLength: 1
      maxLength: 4096
  - name: sort_key
    value_type: text
    required: false
    schema:
      type: string
      title: Sort by
      enum:
      - CREATED_AT
      - ID
      - INVENTORY_TOTAL
      - PRODUCT_TYPE
      - PUBLISHED_AT
      - RELEVANCE
      - TITLE
      - UPDATED_AT
      - VENDOR
      default: ID
  - name: reverse
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Reverse order
      description: Return the results in reverse order.
      default: false
  - name: saved_search_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Saved search id
      description: A gid://shopify/SavedSearch/... id whose query to apply.
  - name: quality_filter
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: false
      properties:
        match:
          type: string
          enum:
          - any
          - all
          title: Match
          description: 'any: a product with at least one of the checked problems. all: only products with every checked problem.'
          default: any
        missing_images:
          type: boolean
          title: No images
        min_image_width:
          type: integer
          title: Minimum image width
          description: Flag any image narrower than this, in pixels. Shopify recommends 2048.
          minimum: 1
          maximum: 20000
        min_image_height:
          type: integer
          title: Minimum image height
          description: Flag any image shorter than this, in pixels.
          minimum: 1
          maximum: 20000
        below_recommended_image_size:
          type: boolean
          title: Images below Shopify's recommendation
          description: Flag any image smaller than 2048 x 2048 px.
        missing_image_alt_text:
          type: boolean
          title: Images without alt text
        missing_description:
          type: boolean
          title: No description
        min_description_length:
          type: integer
          title: Minimum description length
          description: Flag a description shorter than this many characters of plain text (HTML tags are not counted).
          minimum: 1
          maximum: 65535
        missing_fields:
          type: array
          maxItems: 10
          items:
            type: string
            enum:
            - vendor
            - product_type
            - category
            - tags
            - seo_title
            - seo_description
            - sku
            - barcode
            - weight
            - price
          title: Fields that must be filled
          description: sku, barcode, weight and price are checked on every variant.
          minItems: 1
      title: Only products that need attention
      description: Export only the products with catalog gaps — missing or small images, short descriptions, empty attributes — each with the list of what is wrong. Shopify's search cannot filter on these, so the whole matching catalog is read and checked.
  outputs:
  - name: artifact_handle
    value_type: artifact_handle
  - name: filename
    value_type: text
    schema:
      type: string
  - name: content_type
    value_type: text
    schema:
      type: string
  - name: item_count
    value_type: integer
    schema:
      type: integer
      minimum: 0
  - name: scanned_count
    value_type: integer
    schema:
      type: integer
      minimum: 0
  - name: page_count
    value_type: integer
    schema:
      type: integer
      minimum: 1
  - name: size_bytes
    value_type: integer
    schema:
      type: integer
      minimum: 0
  - name: sha256
    value_type: text
    schema:
      type: string
  - name: artifacts
    value_type: object
    schema:
      type: object
  result_fields:
  - result.artifact_handle
  - result.filename
  - result.content_type
  - result.item_count
  - result.scanned_count
  - result.page_count
  - result.size_bytes
  - result.sha256
  - result.artifacts
  error_codes:
  - invalid_payload
