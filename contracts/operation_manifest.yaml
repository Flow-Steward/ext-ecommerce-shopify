- operation_id: update_product
  display_name: Update a product
  description: Changes one product, found by id, handle or a unique metafield. Only the fields you supply are sent; everything else is left as it is. replace_tags overwrites the whole tag list. New images can be attached from URLs or Flow Steward artifacts.
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  effect_kind: shopify_product_update
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: product_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Product id
      description: A gid://shopify/Product/... id.
  - name: product_handle
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 255
      title: Product handle
      description: Find the product by its handle instead of its id.
  - name: product_custom_id
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          maxLength: 255
          minLength: 1
        key:
          type: string
          maxLength: 255
          minLength: 1
        value:
          type: string
          maxLength: 255
          minLength: 1
      title: Product custom id
      description: Find the product by a unique metafield value instead of its id.
      required:
      - key
      - value
  - name: title
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 255
      title: Title
  - name: handle
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 255
      title: Handle
      description: A new URL handle.
  - name: redirect_new_handle
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Redirect the old handle
      description: Keep the old URL working when the handle changes. Default true.
      default: true
  - name: description_html
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 65535
      title: Description HTML
  - name: vendor
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Vendor
  - name: product_type
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Product type
  - name: category_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Category id
      description: A gid://shopify/TaxonomyCategory/... id.
  - name: seo_title
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: SEO title
  - name: seo_description
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 1024
      title: SEO description
  - name: template_suffix
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Theme template suffix
  - name: gift_card_template_suffix
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Gift card template suffix
  - name: requires_selling_plan
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Sold only by subscription
  - name: replace_tags
    value_type: array
    required: false
    schema:
      type: array
      title: Replace tags
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 255
      description: Replaces the product's entire tag list. Send [] to clear every tag.
  - name: status
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
      - DRAFT
      - UNLISTED
      title: Status
  - name: join_collection_ids
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 128
      description: gid://shopify/Collection/... ids.
      title: Add to collections
  - name: leave_collection_ids
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 128
      description: gid://shopify/Collection/... ids.
      title: Remove from collections
  - name: delete_conflicting_constrained_metafields
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Delete metafields the new category does not allow
      description: 'Only with category_id. Default false: such metafields are kept and Shopify refuses the change instead.'
      default: false
  - name: metafields
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 250
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
            description: An existing gid://shopify/Metafield/... id to update.
          namespace:
            type: string
            maxLength: 255
            minLength: 3
          key:
            type: string
            maxLength: 64
            minLength: 2
          type:
            type: string
            maxLength: 64
            minLength: 1
          value:
            type: string
            maxLength: 524288
      title: Metafields
      description: Metafields to create or update on the product.
  - name: media
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 250
      items:
        type: object
        additionalProperties: false
        properties:
          source_url:
            type: string
            maxLength: 2048
            title: Source URL
            description: A public https:// URL Shopify downloads. For EXTERNAL_VIDEO, a YouTube or Vimeo URL.
            minLength: 9
          content_type:
            type: string
            enum:
            - IMAGE
            - VIDEO
            - EXTERNAL_VIDEO
            - MODEL_3D
            title: Content type
            default: IMAGE
          alt:
            type: string
            maxLength: 512
            title: Alt text
        required:
        - source_url
      title: Media
      description: Media to create from public URLs and attach. Processed asynchronously.
  - name: image_files
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        properties:
          artifact_handle:
            type: string
            maxLength: 512
            title: Image artifact
            description: The artifact handle of a JPEG, PNG, GIF or WEBP file, up to 20 MB.
            minLength: 1
          alt:
            type: string
            maxLength: 512
            title: Alt text
          filename:
            type: string
            maxLength: 255
            title: Filename
            description: The name Shopify stores. Defaults to the artifact's own name.
        required:
        - artifact_handle
      title: Image files
      description: Images stored in Flow Steward (workflow artifacts) to upload and attach. Each file goes through Shopify's staged upload first; up to 20 per call.
  outputs:
  - name: product
    value_type: object
    schema:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - id
      - title
      - handle
      - description_html
      - description
      - vendor
      - product_type
      - status
      - tags
      - category_id
      - seo
      - created_at
      - updated_at
      - published_at
      - options
      - combined_listing_role
      - gift_card_template_suffix
      - has_only_default_variant
      - has_out_of_stock_variants
      - has_variants_that_requires_components
      - is_gift_card
      - legacy_resource_id
      - online_store_preview_url
      - online_store_url
      - requires_selling_plan
      - template_suffix
      - total_inventory
      - tracks_inventory
      properties:
        id:
          type: string
        title:
          type:
          - string
          - 'null'
        handle:
          type:
          - string
          - 'null'
        description_html:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        vendor:
          type:
          - string
          - 'null'
        product_type:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        tags:
          type: array
          items:
            type: string
        category_id:
          type:
          - string
          - 'null'
        seo:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - title
          - description
          properties:
            title:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
        published_at:
          type:
          - string
          - 'null'
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            - position
            - values
            properties:
              id:
                type: string
              name:
                type:
                - string
                - 'null'
              position:
                type:
                - integer
                - 'null'
              values:
                type: array
                items:
                  type: string
        combined_listing_role:
          type:
          - string
          - 'null'
        gift_card_template_suffix:
          type:
          - string
          - 'null'
        has_only_default_variant:
          type:
          - boolean
          - 'null'
        has_out_of_stock_variants:
          type:
          - boolean
          - 'null'
        has_variants_that_requires_components:
          type:
          - boolean
          - 'null'
        is_gift_card:
          type:
          - boolean
          - 'null'
        legacy_resource_id:
          type:
          - string
          - 'null'
        online_store_preview_url:
          type:
          - string
          - 'null'
        online_store_url:
          type:
          - string
          - 'null'
        requires_selling_plan:
          type:
          - boolean
          - 'null'
        template_suffix:
          type:
          - string
          - 'null'
        total_inventory:
          type:
          - integer
          - 'null'
        tracks_inventory:
          type:
          - boolean
          - 'null'
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
