    value_type: connection_ref
    required: true
  - name: media_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Media id
      description: A MediaImage, Video, Model3d, ExternalVideo or GenericFile id.
  - name: alt
    value_type: text
    required: false
