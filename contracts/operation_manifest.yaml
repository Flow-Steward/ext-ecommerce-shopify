                - MM
                - CM
                - M
                - IN
                - FT
                - YD
                - M2
                - FT2
                - ITEM
                - UNKNOWN
              reference_value:
                type: integer
                minimum: 1
                maximum: 1000000
              reference_unit:
                type: string
                enum:
                - ML
                - CL
                - L
                - M3
                - FLOZ
                - PT
                - QT
                - GAL
                - MG
                - G
                - KG
                - OZ
                - LB
                - MM
                - CM
                - M
                - IN
                - FT
                - YD
                - M2
                - FT2
                - ITEM
                - UNKNOWN
          inventory_item:
            type: object
            additionalProperties: false
            properties:
              sku:
                type: string
                maxLength: 255
                minLength: 1
              cost:
                type: string
                description: A decimal amount as a string, for example "19.99".
                minLength: 1
                maxLength: 32
              tracked:
                type: boolean
              requires_shipping:
                type: boolean
              country_code_of_origin:
                type: string
                maxLength: 2
                description: ISO 3166-1 alpha-2.
                minLength: 2
              province_code_of_origin:
                type: string
                maxLength: 8
                minLength: 1
              harmonized_system_code:
                type: string
                maxLength: 14
                minLength: 6
              country_harmonized_system_codes:
                type: array
                maxItems: 250
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    harmonized_system_code:
                      type: string
                      maxLength: 14
                      minLength: 6
                    country_code:
                      type: string
                      maxLength: 2
                      minLength: 2
                  required:
                  - harmonized_system_code
              measurement:
