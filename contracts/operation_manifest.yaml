          owner_id:
            type:
            - string
            - 'null'
          namespace:
            type:
            - string
            - 'null'
          key:
            type:
            - string
            - 'null'
          type:
            type:
            - string
            - 'null'
          value:
            type:
            - string
            - 'null'
          compare_digest:
            type:
            - string
            - 'null'
