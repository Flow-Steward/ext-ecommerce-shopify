- operation_id: create_product
  display_name: Create a product
  description: 'Creates one product with its variants in a single atomic Shopify call: SKU, price, barcode, weight, starting stock, images and metafields included. The product is a DRAFT unless status says otherwise. Images come from public URLs, existing Shopify files or Flow Steward artifacts and are processed asynchronously. product_variants returns every created variant with its inventory item.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  effect_kind: shopify_product_create
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: title
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 255
      title: Title
  - name: handle
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 255
      title: Handle
      description: The URL handle. Required here so a product is found again by a known handle; Shopify refuses one that is already taken.
  - name: description_html
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 65535
      title: Description HTML
  - name: vendor
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Vendor
  - name: product_type
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Product type
  - name: category_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Category id
      description: A gid://shopify/TaxonomyCategory/... id.
  - name: seo_title
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: SEO title
  - name: seo_description
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 1024
      title: SEO description
  - name: template_suffix
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Theme template suffix
  - name: gift_card_template_suffix
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Gift card template suffix
  - name: requires_selling_plan
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Sold only by subscription
  - name: tags
    value_type: array
    required: false
    schema:
      type: array
      title: Tags
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 255
  - name: status
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
      - DRAFT
      - UNLISTED
      title: Status
      description: DRAFT unless you choose otherwise. ACTIVE makes it sellable.
      default: DRAFT
  - name: gift_card
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Gift card
  - name: collection_ids
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 128
      description: gid://shopify/Collection/... ids.
      title: Collections
  - name: combined_listing_role
    value_type: text
    required: false
    schema:
      type: string
      enum:
      - PARENT
      - CHILD
      title: Combined listing role
  - name: claim_ownership
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: false
      properties:
        bundles:
          type: boolean
      title: Claim ownership
      description: Claim this product for your app's bundles.
  - name: metafields
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 250
      items:
        type: object
        additionalProperties: false
        properties:
          namespace:
            type: string
            maxLength: 255
            minLength: 3
          key:
            type: string
            maxLength: 64
            minLength: 2
          type:
            type: string
