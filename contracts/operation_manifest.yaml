- operation_id: export_products
  display_name: Export all matching products
  description: Follows every Shopify product cursor and streams the complete matching catalog to a JSONL artifact. Use filter to export a filtered subset.
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: first
    value_type: integer
    required: false
    schema:
      type: integer
      title: Page size
      description: How many products to read per request, 1 to 250.
      minimum: 1
      maximum: 250
      default: 50
  - name: include_images
    value_type: boolean
    required: false
    schema:
      type: boolean
      default: false
      title: Include images
      description: Export all image media with URL and alt text, plus image_count. Adds paginated reads.
  - name: include_variants
    value_type: boolean
    required: false
    schema:
      type: boolean
      default: false
      title: Include variants
      description: Export all variants with SKU, selected options and prices. Adds paginated reads.
  - name: include_inventory
    value_type: boolean
    required: false
    schema:
      type: boolean
      default: false
      title: Include inventory
      description: Include variants automatically and export all inventory locations and quantities. Requires read_inventory or write_inventory, plus read_locations. Adds paginated reads.
  - name: filter
    value_type: text
    required: false
    schema:
      type: string
      title: Shopify search query
      description: An optional Shopify product search expression, for example status:active, vendor:Acme, tag:summer, or category_id:sg-4-17.
      minLength: 1
      maxLength: 4096
  outputs:
  - name: artifact_handle
    value_type: artifact_handle
  - name: filename
    value_type: text
    schema:
      type: string
  - name: content_type
    value_type: text
    schema:
      type: string
  - name: item_count
    value_type: integer
    schema:
      type: integer
      minimum: 0
  - name: page_count
    value_type: integer
    schema:
      type: integer
      minimum: 1
  - name: size_bytes
    value_type: integer
    schema:
      type: integer
      minimum: 0
  - name: sha256
    value_type: text
    schema:
      type: string
  - name: artifacts
    value_type: object
    schema:
      type: object
  result_fields:
  - result.artifact_handle
  - result.filename
  - result.content_type
  - result.item_count
  - result.page_count
  - result.size_bytes
  - result.sha256
  - result.artifacts
  error_codes:
