- operation_id: create_fulfillment
  display_name: Create a fulfillment
  description: 'Fulfills named line items on named fulfillment orders. Every line item and quantity must be stated: Shopify would otherwise fulfil everything remaining, and that is not a decision an omitted field should make. The customer is not notified.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_assigned_fulfillment_orders
  - write_merchant_managed_fulfillment_orders
  - write_third_party_fulfillment_orders
  effect_kind: shopify_fulfillment_create
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: fulfillment_orders
    value_type: array
    required: true
    schema:
      type: array
      title: Fulfillment orders
      description: The fulfillment orders to fulfil, each with its explicit line items.
      minItems: 1
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - fulfillment_order_id
        - line_items
        properties:
          fulfillment_order_id:
            type: string
            minLength: 1
            maxLength: 128
          line_items:
            type: array
            minItems: 1
            maxItems: 250
            items:
              type: object
              additionalProperties: false
              required:
              - fulfillment_order_line_item_id
              - quantity
              properties:
                fulfillment_order_line_item_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
  - name: tracking
    value_type: object
    required: false
    schema:
      type: object
      title: Tracking
      description: Carrier and tracking details. At least one field must be present.
      additionalProperties: false
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 255
        numbers:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
            maxLength: 255
        urls:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
            maxLength: 2048
  outputs:
  - name: fulfillment
    value_type: object
    schema:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - updated_at
      - tracking_info
      properties:
        id:
          type: string
        status:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
        tracking_info:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - company
            - number
            - url
            properties:
              company:
                type:
                - string
                - 'null'
              number:
                type:
                - string
                - 'null'
              url:
                type:
                - string
                - 'null'
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.fulfillment
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes:
