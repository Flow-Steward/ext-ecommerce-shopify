      maxLength: 32
  - name: shipping_address
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        company:
          type: string
          maxLength: 255
        address1:
          type: string
          maxLength: 255
        address2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        province_code:
          type: string
          maxLength: 8
        zip:
          type: string
          maxLength: 32
        country_code:
          type: string
          maxLength: 2
          minLength: 2
        phone:
          type: string
          maxLength: 32
      title: Shipping address
      description: Replaces the shipping address. Needs Shopify's protected customer data access.
  - name: metafields
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 250
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
            description: An existing gid://shopify/Metafield/... id to update.
          namespace:
            type: string
            maxLength: 255
            minLength: 3
          key:
            type: string
            maxLength: 64
            minLength: 2
          type:
            type: string
            maxLength: 64
            minLength: 1
          value:
            type: string
            maxLength: 524288
      title: Metafields
      description: Metafields to create or update on the order.
  - name: localized_fields
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        properties:
          key:
            type: string
            maxLength: 64
            minLength: 1
          value:
            type: string
            maxLength: 255
            minLength: 1
        required:
        - key
        - value
      title: Localized fields
      description: Country-specific fields such as TAX_CREDENTIAL_BR or SHIPPING_CREDENTIAL_MX.
