- operation_id: update_order_metadata
  display_name: Update order metadata
  description: Changes an order's note, PO number, tags or custom attributes. The two replace_ fields overwrite their whole list. Customers, addresses, payments, line items, refunds and order edits are out of reach here.
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_orders
  effect_kind: shopify_order_metadata_update
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: order_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Order id
      description: A gid://shopify/Order/... id.
  - name: note
    value_type: text
    required: false
    schema:
      type: string
      title: Note
      description: Replaces the order note. Must not be empty.
      minLength: 1
      maxLength: 5000
  - name: po_number
    value_type: text
    required: false
    schema:
      type: string
      title: PO number
      description: Replaces the purchase order number. Must not be empty.
      minLength: 1
      maxLength: 255
  - name: replace_tags
    value_type: array
    required: false
    schema:
      type: array
      title: Replace tags
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 255
      description: Replaces the order's entire tag list. An empty list is refused.
      minItems: 1
  - name: replace_custom_attributes
    value_type: array
    required: false
    schema:
      type: array
      title: Replace custom attributes
      description: Replaces the order's entire custom attribute list. An empty list is refused.
      minItems: 1
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - key
        - value
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 255
          value:
            type: string
            maxLength: 2048
  outputs:
  - name: order
    value_type: object
    schema:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - id
      - name
      - updated_at
      - tags
      - note
      - po_number
      - custom_attributes
      properties:
        id:
          type: string
        name:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
        tags:
          type: array
          items:
            type: string
        note:
          type:
          - string
          - 'null'
        po_number:
          type:
          - string
          - 'null'
        custom_attributes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - value
            properties:
              key:
                type:
                - string
                - 'null'
              value:
                type:
                - string
                - 'null'
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
