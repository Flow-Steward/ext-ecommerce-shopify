  display_name: Update a media file
  description: 'Changes one existing file in Shopify Files: its alt text, its source (replacing the file), its preview image, its filename, and which products it is attached to.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
