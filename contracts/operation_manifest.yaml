- operation_id: create_fulfillment
  display_name: Create a fulfillment
  description: 'Fulfills named line items on named fulfillment orders. Every line item and quantity must be stated: Shopify would otherwise fulfil everything remaining, and that is not a decision an omitted field should make. The customer is notified only when notify_customer is true.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_assigned_fulfillment_orders
  - write_merchant_managed_fulfillment_orders
  - write_third_party_fulfillment_orders
  effect_kind: shopify_fulfillment_create
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: fulfillment_orders
    value_type: array
    required: true
    schema:
      type: array
      title: Fulfillment orders
      description: The fulfillment orders to fulfil, each with its explicit line items.
      minItems: 1
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - fulfillment_order_id
        - line_items
        properties:
          fulfillment_order_id:
            type: string
            minLength: 1
            maxLength: 128
          line_items:
            type: array
            minItems: 1
            maxItems: 250
            items:
              type: object
              additionalProperties: false
              required:
              - fulfillment_order_line_item_id
              - quantity
              properties:
                fulfillment_order_line_item_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
  - name: tracking
    value_type: object
    required: false
    schema:
      type: object
      title: Tracking
      description: Carrier and tracking details. At least one field must be present.
      additionalProperties: false
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 255
        numbers:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
            maxLength: 255
        urls:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
            maxLength: 2048
  - name: notify_customer
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Notify the customer
      description: Email the customer about this change. Default false.
      default: false
  - name: origin_address
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: false
      properties:
        address1:
          type: string
          maxLength: 255
        address2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        zip:
          type: string
          maxLength: 32
        province_code:
          type: string
          maxLength: 8
        country_code:
          type: string
          maxLength: 2
          minLength: 2
      title: Shipped from
      description: The address the goods leave from, if not the assigned location.
      required:
      - country_code
  - name: message
    value_type: text
    required: false
    schema:
      type: string
      title: Message
      description: A note recorded with the fulfillment.
      minLength: 1
      maxLength: 5000
  outputs:
  - name: fulfillment
    value_type: object
    schema:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - id
      - name
      - status
      - display_status
      - legacy_resource_id
      - total_quantity
      - requires_shipping
      - created_at
      - updated_at
      - in_transit_at
      - estimated_delivery_at
      - delivered_at
      - tracking_info
      properties:
        id:
          type: string
        name:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        display_status:
          type:
          - string
          - 'null'
