- operation_id: set_catalog_metafields
  display_name: Set catalog metafields
  description: Creates or updates 1 to 25 metafields on products and product variants in one atomic call. Every entry carries a compare digest, so a value someone else changed since you read it is refused rather than overwritten.
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  effect_kind: shopify_catalog_metafields_set
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: metafields
    value_type: array
    required: true
    schema:
      type: array
      title: Metafields
      description: Between 1 and 25 metafields to set.
      minItems: 1
      maxItems: 25
      items:
        type: object
        additionalProperties: false
        required:
        - owner_id
        - namespace
        - key
        - type
        - value
        - compare_digest
        properties:
          owner_id:
            type: string
            minLength: 1
            maxLength: 128
            description: A Product or ProductVariant id.
          namespace:
            type: string
            minLength: 3
            maxLength: 255
          key:
            type: string
            minLength: 2
            maxLength: 64
          type:
            type: string
            minLength: 1
            maxLength: 64
          value:
            type: string
            maxLength: 524288
          compare_digest:
            type:
            - string
            - 'null'
            description: The compare digest you read with the value, or null to create only.
            maxLength: 512
  outputs:
  - name: metafields
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - namespace
        - key
        - type
        - value
        - json_value
        - compare_digest
        - owner_type
        - size_in_bytes
        - legacy_resource_id
        - created_at
        - updated_at
        - owner_id
        properties:
          id:
            type: string
          namespace:
            type:
            - string
            - 'null'
          key:
            type:
            - string
            - 'null'
          type:
            type:
