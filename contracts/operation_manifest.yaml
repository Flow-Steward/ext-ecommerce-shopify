            minLength: 2
            maxLength: 64
          type:
            type: string
            minLength: 1
            maxLength: 64
          value:
            type: string
            maxLength: 524288
          compare_digest:
            type:
            - string
            - 'null'
            description: The compare digest you read with the value, or null to create only.
            maxLength: 512
