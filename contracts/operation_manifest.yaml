        type: object
        additionalProperties: false
        required:
        - id
        - namespace
        - key
        - type
        - value
        - json_value
        - compare_digest
        - owner_type
        - size_in_bytes
        - legacy_resource_id
        - created_at
        - updated_at
        - owner_id
        properties:
          id:
            type: string
          namespace:
            type:
            - string
            - 'null'
          key:
            type:
            - string
            - 'null'
          type:
            type:
            - string
            - 'null'
          value:
            type:
            - string
            - 'null'
          json_value: {}
          compare_digest:
            type:
            - string
            - 'null'
          owner_type:
            type:
            - string
            - 'null'
          size_in_bytes:
            type:
            - integer
            - 'null'
          legacy_resource_id:
            type:
            - string
            - 'null'
          created_at:
            type:
            - string
            - 'null'
          updated_at:
            type:
            - string
            - 'null'
          owner_id:
            type:
            - string
            - 'null'
  - name: page_info
    value_type: object
    schema:
      type: object
      additionalProperties: false
      required:
      - has_next_page
