- operation_id: create_product
  display_name: Create a product
  description: Creates one product as a draft. Shopify creates only the initial variant, using the first value of each supplied option. product_variants contains that one variant and its inventory item so a workflow can immediately set SKU, price and stock; add the rest with the variant batch operations. Optional images are downloaded from public HTTPS URLs and processed asynchronously. No metafields, collections or publications are created.
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  effect_kind: shopify_product_create
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: title
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 255
      title: Title
  - name: handle
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 255
      title: Handle
      description: The URL handle. Shopify rejects the call if it is already taken.
  - name: description_html
    value_type: text
    required: false
    schema:
      type: string
      title: Description HTML
      maxLength: 65535
  - name: vendor
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Vendor
  - name: product_type
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: Product type
  - name: tags
    value_type: array
    required: false
    schema:
      type: array
      title: Tags
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 255
  - name: category_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Category id
      description: A gid://shopify/TaxonomyCategory/... id.
  - name: seo_title
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
      title: SEO title
  - name: seo_description
    value_type: text
    required: false
