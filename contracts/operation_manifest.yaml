- operation_id: update_order_metadata
  display_name: Update an order
  description: 'Changes what Shopify lets an app edit on an existing order: note, PO number, tags, custom attributes, metafields, contact email and phone, shipping address and localized fields. The replace_ fields overwrite their whole list. Line items, payments, refunds and order edits are out of reach here.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_orders
  effect_kind: shopify_order_metadata_update
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: order_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
      title: Order id
      description: A gid://shopify/Order/... id.
  - name: note
    value_type: text
    required: false
    schema:
      type: string
      title: Note
      description: Replaces the order note.
      maxLength: 5000
  - name: po_number
    value_type: text
    required: false
    schema:
      type: string
      title: PO number
      description: Replaces the purchase order number.
      maxLength: 255
  - name: replace_tags
    value_type: array
    required: false
    schema:
      type: array
      title: Replace tags
      maxItems: 250
      items:
        type: string
        minLength: 1
        maxLength: 255
      description: Replaces the order's entire tag list. Send [] to clear every tag.
  - name: replace_custom_attributes
    value_type: array
    required: false
    schema:
      type: array
      title: Replace custom attributes
      description: Replaces the order's entire custom attribute list.
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - key
        - value
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 255
          value:
            type: string
            maxLength: 2048
  - name: email
    value_type: text
    required: false
    schema:
      type: string
      title: Contact email
      description: The order's contact email. Needs Shopify's protected customer data access.
      minLength: 3
      maxLength: 320
  - name: phone
    value_type: text
    required: false
    schema:
      type: string
