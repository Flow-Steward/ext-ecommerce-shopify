- operation_id: create_products_bulk
  display_name: Create products in bulk
  description: 'Uploads a batch of new products for asynchronous creation. Each row takes the same fields as create_product, variants included, except image_files: use media URLs. Supply either products or a JSONL artifact. Submission success is not per-row success; Shopify continues processing after this action returns.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - shopify_admin
  contacts_shopify: true
  workflow_visible: true
  required_oauth_scopes:
  - write_products
  effect_kind: shopify_product_bulk_create
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: products
    value_type: array
    required: false
    schema:
      type: array
      title: Products
      minItems: 1
      maxItems: 10000
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - handle
        properties:
          title:
            type: string
            minLength: 1
            maxLength: 255
            title: Title
          handle:
            type: string
            minLength: 1
            maxLength: 255
            title: Handle
            description: The URL handle. Required here so a product is found again by a known handle; Shopify refuses one that is already taken.
          description_html:
            type: string
            maxLength: 65535
            title: Description HTML
          vendor:
            type: string
            maxLength: 255
            title: Vendor
          product_type:
            type: string
            maxLength: 255
            title: Product type
          category_id:
            type: string
            minLength: 1
            maxLength: 128
            title: Category id
            description: A gid://shopify/TaxonomyCategory/... id.
          seo_title:
            type: string
            maxLength: 255
            title: SEO title
          seo_description:
            type: string
            maxLength: 1024
            title: SEO description
          template_suffix:
            type: string
            maxLength: 255
            title: Theme template suffix
          gift_card_template_suffix:
            type: string
            maxLength: 255
            title: Gift card template suffix
          requires_selling_plan:
            type: boolean
            title: Sold only by subscription
          tags:
            type: array
            title: Tags
            maxItems: 250
            items:
              type: string
              minLength: 1
              maxLength: 255
          status:
            type: string
            enum:
            - ACTIVE
            - ARCHIVED
            - DRAFT
            - UNLISTED
            title: Status
            description: DRAFT unless you choose otherwise. ACTIVE makes it sellable.
            default: DRAFT
          gift_card:
            type: boolean
            title: Gift card
          collection_ids:
            type: array
            maxItems: 250
            items:
              type: string
              minLength: 1
              maxLength: 128
            description: gid://shopify/Collection/... ids.
            title: Collections
          combined_listing_role:
            type: string
            enum:
            - PARENT
            - CHILD
            title: Combined listing role
          claim_ownership:
            type: object
            additionalProperties: false
            properties:
              bundles:
                type: boolean
            title: Claim ownership
            description: Claim this product for your app's bundles.
          metafields:
            type: array
            maxItems: 250
            items:
              type: object
              additionalProperties: false
              properties:
                namespace:
                  type: string
                  maxLength: 255
                  minLength: 3
                key:
                  type: string
                  maxLength: 64
                  minLength: 2
                type:
                  type: string
                  maxLength: 64
                  minLength: 1
                value:
                  type: string
                  maxLength: 524288
              required:
              - namespace
              - key
              - type
              - value
            title: Metafields
            description: Metafields to set on the new product.
          options:
            type: array
            maxItems: 3
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
                position:
                  type: integer
                  minimum: 1
                  maximum: 3
                values:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 255
                    minLength: 1
                  minItems: 1
                linked_metafield:
                  type: object
                  additionalProperties: false
                  properties:
                    namespace:
                      type: string
                      maxLength: 255
                      minLength: 1
                    key:
                      type: string
                      maxLength: 255
                      minLength: 1
                    values:
                      type: array
                      maxItems: 100
                      items:
                        type: string
                        maxLength: 255
                        minLength: 1
                  required:
                  - namespace
                  - key
              required:
              - name
            title: Options
            description: Up to three options. Give values, or link the option to a metafield. Without variants, Shopify builds the initial variant from the first value of each.
          variants:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              properties:
                option_values:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      option_name:
                        type: string
                        maxLength: 255
                        minLength: 1
                      value:
                        type: string
                        maxLength: 255
                        minLength: 1
                      linked_metafield_value:
                        type: string
                        maxLength: 255
                        description: For an option linked to a metafield, the metafield value to use.
                    required:
                    - option_name
                  minItems: 1
                  description: Required when the product has options; omit for a single-variant product without options.
                price:
                  type: string
                  description: A decimal amount as a string, for example "19.99".
                  minLength: 1
                  maxLength: 32
                compare_at_price:
                  type: string
                  description: A decimal amount as a string, for example "19.99".
                  minLength: 1
                  maxLength: 32
                barcode:
                  type: string
                  maxLength: 255
                inventory_policy:
                  type: string
                  enum:
                  - DENY
                  - CONTINUE
                taxable:
